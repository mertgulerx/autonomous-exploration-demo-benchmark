# Benchmark Default of m-explore-ros2 (explore_lite): the shipped explore/config/params.yaml of
# github.com/robo-friends/m-explore-ros2 at 326cf8a0b487c34246bb8f3326afbcd69576dc60 (BSD licence), unchanged except
# where marked (docs/plans/EXTERNAL_EXPLORERS.md, decisions E2, E3 and E9). use_sim_time is set by the benchmark.
explore_node:
  ros__parameters:
    robot_base_frame: base_link
    return_to_init: false  # benchmark (E3); shipped true
    costmap_topic: map
    costmap_updates_topic: map_updates
    visualize: true
    planner_frequency: 1.0  # benchmark (maintainer, 26 October 2026): the code default, for comparability; shipped 0.15
    progress_timeout: 30.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 0.75
