# Benchmark Default of roadmap-explorer: the author's 2D-lidar file params/tb3_exploration_params.yaml of
# github.com/suchetanrs/roadmap-explorer at 203ff2602e1a1e41eec7ef663eacc21266e270c6 (Apache-2.0), unchanged except
# where marked "benchmark" (docs/plans/EXTERNAL_EXPLORERS.md, decisions E2 and E4). Generated per run (managed):
# explorationBT.exploration_boundary (the world reference's bounds) and the costmap footprint (the robot's).
roadmap_explorer_node:
  ros__parameters:
    use_sim_time: True  # benchmark (simulation clock)
    localisation_only_mode: false  # benchmark (E4): SLAM mode on the run's /map
    
    frontierSearch:
      frontier_search_distance: 25.0 # This should be equal to the parameter frontier_search_distance in frontier_roadmap_node
      max_permissable_frontier_search_distance: 140.0
      # benchmark (B4, 26 October 2026): the shipped file sets 35.0 under explorationBT, which the code never reads
      # (it reads frontierSearch.increment_search_distance_by, default 0.1); placed where the code reads it.
      increment_search_distance_by: 35.0
      plugin_name: "GridBasedBFS"
      GridBasedBFS:
        plugin_type: "roadmap_explorer::FrontierBFSearch"
        min_frontier_cluster_size: 1.0
        max_frontier_cluster_size: 20.0
        lethal_threshold: 160 # >= is lethal, < is free space.

    costAssigner:
      information_gain_plugin_name: "CountBasedGain"
      CountBasedGain:
        plugin_type: "roadmap_explorer::CountBasedGain"
        max_camera_depth: 2.0
        delta_theta: 0.10
        camera_fov: 1.04
        factor_of_max_is_min: 0.0
      
      planner_plugin_name: "FrontierRoadmap"
      FrontierRoadmap:
        plugin_type: "roadmap_explorer::PluginFrontierRoadmap"
        closeness_rejection_threshold: 0.5
        planner_allow_unknown: true
        max_planning_distance_roadmap: 12.5
    
    frontierRoadmap:
      max_graph_reconstruction_distance: 25.0
      grid_cell_size: 1.0                           # Assuming each cell is 1x1 in size
      radius_to_decide_edges: 6.1                   # a node within this radius of another node is considered a child of the other node.
      min_distance_between_two_frontier_nodes: 0.25  # minimum distance between any node in the graph and the frontier node that will be added.
      min_distance_between_robot_pose_and_node: 0.25 # minimum distance between any nodes in the graph and the robot pose that is going to be added.

    fullPathOptimizer:
      num_frontiers_in_local_area: 5.0
      local_frontier_search_radius: 12.0
      add_yaw_to_tsp: false
      add_distance_to_robot_to_tsp: false
      goal_hysteresis_threshold: 0.15  # New goal must be 15% better to switch (0.0 = always switch, 1.0 = never switch) 

    explorationBT:
      bt_sleep_ms: 70
      exploration_boundary: [310.0, 260.0, 310.0, -120.0, -70.0, -120.0, -70.0, 260.0]
      abort_exploration_on_nav2_abort: false
      localisation_only_mode: false  # benchmark (E4)
    
    sensorSimulator:
      input_map_topic: "/map"
      input_map_is_transient_local: true
      explored_map_topic: "/explored_map"
      angular_resolution: 0.013
      sensor_update_rate: 1.0
      sensor_min_angle: 0.0
      sensor_max_angle: 6.30
      sensor_max_range: 1.5

roadmap_explorer_costmap:
  roadmap_explorer_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True  # benchmark (simulation clock)
      resolution: 0.05
      robot_radius: 0.60  # replaced per run by the robot's footprint (benchmark, E4)
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"  # benchmark (E4): the SLAM map; shipped /explored_map (sensor simulator)
        map_subscribe_transient_local: True  # benchmark: SLAM Toolbox publishes /map transient-local
        enabled: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.10
        cost_scaling_factor: 0.5
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: True
