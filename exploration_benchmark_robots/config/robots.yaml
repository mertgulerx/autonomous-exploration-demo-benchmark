catalog_version: 3
default_robot: tb4_standard
robots:
  tb3_waffle_pi:
    id: tb3_waffle_pi
    label: TurtleBot3 Waffle Pi
    family: turtlebot3
    version: 6
    adapter: turtlebot3
    model: turtlebot3_waffle_pi
    packages:
    - turtlebot3_gazebo
    - turtlebot3_description
    max_linear_speed: 0.26
    max_angular_speed: 1.0
    max_lateral_speed: 0.0
    linear_acceleration: 1.0
    angular_acceleration: 3.2
    footprint:
    - - -0.2015
      - -0.158
    - - -0.2015
      - 0.158
    - - 0.0735
      - 0.158
    - - 0.0735
      - -0.158
    spawn_z: 0.01
    physics_step: 0.005
    kinematics: differential
    required_streams:
    - clock
    - scan
    - odom
    - imu
    lidar:
      label: LDS-02 GPU 2D lidar
      model: LDS-02
      range_min: 0.16
      range_max: 8.0
      update_rate: 5.0
      samples: 360
      specification: https://emanual.robotis.com/docs/en/platform/turtlebot3/appendix_lds_02/
    limits_source: Native Gazebo DiffDrive linear acceleration (1 m/s^2); official
      Jazzy navigation angular limits and manufacturer linear speed bound. Physics
      step 5 ms (version 6, 26 October 2026; native 1 ms before) is the longest step
      that keeps the 200 Hz IMU and divides the 10 ms ground-truth period; it cuts the
      physics work about fivefold.
    footprint_source: Native zero-joint collision envelope plus 5 mm planar margin;
      config/collision_envelopes.json
  tb4_standard:
    id: tb4_standard
    label: TurtleBot4 Standard
    family: turtlebot4
    version: 1
    adapter: turtlebot4
    model: standard
    packages:
    - turtlebot4_description
    - turtlebot4_gz_bringup
    - irobot_create_gz_bringup
    - irobot_create_control
    - gz_ros2_control
    max_linear_speed: 0.46
    max_angular_speed: 1.9
    max_lateral_speed: 0.0
    linear_acceleration: 0.9
    angular_acceleration: 7.725
    footprint:
    - - -0.169
      - -0.1766
    - - -0.169
      - 0.1766
    - - 0.1821
      - 0.1766
    - - 0.1821
      - -0.1766
    spawn_z: 0.01
    physics_step: 0.01
    kinematics: differential
    required_streams:
    - clock
    - scan
    - odom
    - imu
    lidar:
      label: RPLIDAR A1
      range_min: 0.164
      range_max: 12.0
    limits_source: irobot_create_control/config/control.yaml native closed-loop controller
      (no factory hazard/app nodes)
    footprint_source: Native zero-joint collision envelope plus 5 mm planar margin;
      config/collision_envelopes.json
  rosbot_pro:
    id: rosbot_pro
    label: Husarion ROSbot 3 PRO
    family: rosbot
    version: 2
    adapter: rosbot
    model: rosbot
    packages:
    - rosbot_description
    - rosbot_controller
    - rosbot_gazebo
    - husarion_components_description
    - laser_filters
    - rosbot_localization
    max_linear_speed: 1.1
    max_angular_speed: 3.14
    max_lateral_speed: 0.0
    linear_acceleration: 1.2
    angular_acceleration: 5.0
    footprint:
    - - -0.1035
      - -0.119
    - - -0.1035
      - 0.119
    - - 0.1035
      - 0.119
    - - 0.1035
      - -0.119
    spawn_z: 0.01
    physics_step: 0.01
    kinematics: differential
    required_streams:
    - clock
    - scan
    - odom
    - imu
    - raw_odom
    lidar:
      label: RPLIDAR S2
      range_min: 0.05
      range_max: 30.0
    limits_source: Pinned rosbot_controller/config/rosbot/controllers.yaml closed-loop
      differential_drive_controller
    configuration: pro
    angular_deceleration: 7.0
    footprint_source: Native zero-joint collision envelope plus 5 mm planar margin;
      config/collision_envelopes.json
    self_filter:
      min_x: -0.1035
      max_x: 0.1035
      min_y: -0.119
      max_y: 0.119
      min_z: -0.01
      max_z: 0.2065
    measurement_odom_topic: /robot/wheel_odom
