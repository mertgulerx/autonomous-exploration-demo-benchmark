[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "exploration-benchmark-suite"
version = "0.1.0"
description = "Native campaign application for exploration research"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Mert Güler", email = "support.mertgulerx@gmail.com"}]
dependencies = ["PyYAML==6.0.2", "psutil==7.0.0"]

[project.optional-dependencies]
gui = ["PySide6==6.9.3", "pyqtgraph==0.13.7", "numpy==2.2.6"]
engine = ["numpy==2.2.6", "pyarrow==20.0.0", "duckdb==1.3.2", "matplotlib==3.10.3", "scipy==1.15.3", "Pillow==11.2.1", "zstandard==0.24.0"]
dev = ["ruff==0.12.12", "mypy==1.17.1", "types-PyYAML==6.0.12.20250822"]

[project.scripts]
benchmark-suite = "benchmark_suite.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark_suite*"]

[tool.setuptools.package-data]
benchmark_suite = ["icons/*.svg", "assets/robots/*.png", "assets/robots/sources.json", "assets/robots/notices/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
