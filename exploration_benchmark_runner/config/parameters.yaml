map_topic:
  group: Visualization
  description: Occupancy grid topic used to compute frontiers.
  managed: true
costmap_topic:
  group: Visualization
  description: Global costmap topic used to filter candidate frontiers.
  managed: true
local_costmap_topic:
  group: Visualization
  description: Local costmap topic used to invalidate nearby blocked frontier goals.
  managed: true
navigate_to_pose_action_name:
  group: Visualization
  description: Nav2 NavigateToPose action name.
  managed: true
global_frame:
  group: Visualization
  description: Global frame used for frontier goals and TF lookups.
  managed: true
robot_base_frame:
  group: Visualization
  description: Robot base frame used for TF lookups.
  managed: true
frontier_marker_topic:
  group: Visualization
  description: MarkerArray topic used for frontier visualization in RViz.
  managed: true
selected_frontier_topic:
  group: Visualization
  description: Pose topic used to publish the currently selected frontier target for
    debugging.
  managed: true
optimized_map_topic:
  group: Visualization
  description: OccupancyGrid topic used to publish the optimized decision map for
    debugging.
  managed: true
completion_event_topic:
  group: Visualization
  description: 'Requires `completion_event_enabled: true`'
  managed: true
frontier_marker_scale:
  group: Visualization
  description: Marker size for frontier visualization.
  managed: false
map_qos_durability:
  group: QoS
  description: Map QoS profile selection.
  managed: false
  choices:
  - transient_local
  - volatile
map_qos_reliability:
  group: QoS
  description: ''
  managed: false
  choices:
  - reliable
  - best_effort
map_qos_depth:
  group: QoS
  description: ''
  managed: false
  minimum: 1
map_qos_autodetect_on_startup:
  group: QoS
  description: Optional startup-only map durability autodetect helper.
  managed: false
map_qos_autodetect_timeout_s:
  group: QoS
  description: ''
  managed: false
costmap_qos_reliability:
  group: QoS
  description: Costmap QoS profile selection (durability is fixed volatile in code).
  managed: false
  choices:
  - reliable
  - best_effort
costmap_qos_depth:
  group: QoS
  description: ''
  managed: false
  minimum: 1
local_costmap_qos_reliability:
  group: QoS
  description: ''
  managed: false
  choices:
  - inherit
  - reliable
  - best_effort
local_costmap_qos_depth:
  group: QoS
  description: ''
  managed: false
  minimum: -1
map_processing_rate_hz:
  group: Behavior
  description: Refresh Rate of the package. `1.0` is recommended. Use `2.0` if your
    robot is very fast. Use `0.50` if your mapping is slow and you want lowest CPU
    usage.
  managed: false
  exclusive_minimum: 0
autostart:
  group: Behavior
  description: Start exploration immediately at launch.
  managed: true
control_service_enabled:
  group: Behavior
  description: Keep the optional runtime control service available for manual stop/start
    flows.
  managed: true
completion_event_enabled:
  group: Behavior
  description: Publish a completion event so product-specific integrations can react
    outside the package.
  managed: true
escape_enabled:
  group: Behavior
  description: Allow a farther frontier fallback until the first successful frontier.
    Useful if you have a very low range LiDAR or Depth sensor.
  managed: false
return_to_start_on_complete:
  group: Behavior
  description: Return to the recorded start pose once no frontiers remain.
  managed: false
mrtsp_solver:
  group: Behavior
  description: '"dp" optimizes traveling distance by comparing posibilities with limited
    depth. Increasing efficiency but adds extra CPU overhead. "greedy" traverses the
    full MRTSP matrix one step at a time. Cost free.'
  managed: false
  choices:
  - dp
  - greedy
dp_solver_candidate_limit:
  group: Behavior
  description: Maximum number of scored frontier candidates passed into the bounded-horizon
    dp solver.
  managed: false
  minimum: 1
dp_planning_horizon:
  group: Behavior
  description: Number of distinct frontier visits evaluated in the candidate pool.
  managed: false
  minimum: 1
frontier_map_optimization_enabled:
  group: Behavior
  description: Enable decision-map preprocessing for frontier extraction. Disable
    only if you are having performance issues. Not a problem for most CPUs.
  managed: false
goal_preemption_enabled:
  group: Behavior
  description: Replan while navigating if target-pose visible reveal gain for active
    goal is exhausted. Disable if you are having performance issues.
  managed: false
goal_preemption_min_interval_s:
  group: Behavior
  description: Minimum seconds between consecutive goal preemption attempts. Also
    effects performance.
  managed: false
goal_skip_on_blocked_goal:
  group: Behavior
  description: Skip the active frontier goal if it becomes blocked.
  managed: false
post_goal_settle_enabled:
  group: Behavior
  description: Enable the post-goal settle delay after a successful frontier goal.
    Useful if you want stability over speed. Use if you have slow SLAM & LiDAR configuration.
  managed: false
post_goal_min_settle:
  group: Behavior
  description: Minimum seconds to wait before selecting the next frontier after a
    successful goal.
  managed: false
frontier_suppression_enabled:
  group: Suppression
  description: Enable temporary suppression for frontiers that repeatedly fail or
    stall. Use if you are having issues with SLAM or Nav2.
  managed: false
all_frontiers_suppressed_behavior:
  group: Suppression
  description: 'Behavior when frontiers exist but all of them are temporarily suppressed:
    stay or return_to_start. Requires `frontier_suppression_enabled: true`'
  managed: false
  choices:
  - stay
  - return_to_start
weight_distance_wd:
  group: MRTSP Scoring
  description: 'Weight applied to the path-cost term in the frontier cost matrix.
    Increasing this makes the explorer more distance-sensitive and conservative. Decreasing
    it makes information gain dominate more often. Example: 2.0 prefers closer frontiers,
    0.5 allows farther high-gain picks.'
  managed: false
weight_gain_ws:
  group: MRTSP Scoring
  description: 'Weight applied to the frontier information-gain term. Larger values
    favor large frontier clusters that promise more map expansion. Smaller values
    make the robot clean up nearby small frontiers first. Example: 2.0 may skip small
    room corners, 0.5 tends to clear them sooner.'
  managed: false
max_linear_speed_vmax:
  group: MRTSP Scoring
  description: Max linear speed used only in the lower-bound time term. It does not
    command the robot directly; it estimates how fast a frontier can be reached when
    building the first row of the cost matrix. Larger values reduce the time penalty
    of distant frontiers.
  managed: false
  exclusive_minimum: 0
max_angular_speed_wmax:
  group: MRTSP Scoring
  description: 'Max angular speed used in the heading-change part of time lower bound.
    This matters most when candidate frontiers require large initial turns. Larger
    values reduce the penalty of reorientation-heavy options. Example: low values
    prefer frontiers already near the current heading.'
  managed: false
  exclusive_minimum: 0
sensor_effective_range_m:
  group: MRTSP Scoring
  description: 'Effective sensor range subtracted inside the paper''s path-cost term.
    Larger values reduce the effective traversal penalty between frontiers. This favors
    frontiers that can reveal more space from farther away. Example: 0.5 makes costs
    distance-heavy, 2.0 rewards sensing reach more. Doesn''t have to be a real sensor
    value. Used for distance scoring.'
  managed: false
frontier_selection_min_distance:
  group: Navigation Safety
  description: 'Minimum distance before a frontier is considered a valid target. Used
    for dispatch not filterization. Recommended value: 2.5x size of robot''s radius'
  managed: false
frontier_visit_tolerance:
  group: Navigation Safety
  description: Distance used to treat a frontier region as recently visited. Use if
    you are having navigation loops.
  managed: false
frontier_candidate_min_goal_distance_m:
  group: Map Optimization
  description: 'Minimum allowed distance from robot to a consider a frontier point
    as valid. This prevents selecting trivially close frontiers that do not move exploration.
    Higher values reduce local dithering but can skip useful nearby openings. Example:
    0.25 allows immediate local cleanup, 0.5 forces a small commit distance. Recommended
    value: 2.5x size of robot''s radius'
  managed: false
occ_threshold:
  group: Map Optimization
  description: Occupancy threshold applied to the global costmap during frontier validation.
    Neighbor cells at or above this cost are treated as blocked for frontier tests.
    Lower values make the explorer avoid inflated-cost regions more aggressively.
    Higher values allow frontiers closer to obstacles and inflation bands. Value between
    0-100. Use higher values if exploration skips very small areas.
  managed: false
  minimum: 0
  maximum: 100
min_frontier_size_cells:
  group: Map Optimization
  description: Minimum connected frontier size accepted by WFD, measured in cells.
    This removes tiny fragments caused by noise or partial unknown boundaries. Lower
    values increase responsiveness but can create jittery micro-goals. Higher values
    stabilize behavior but may ignore narrow real openings.
  managed: false
  minimum: 1
sigma_s:
  group: Map Optimization
  description: 'Spatial sigma of the bilateral filter in map cells. Larger values
    smooth over wider neighborhoods before frontier extraction. Too low preserves
    noise; too high can merge narrow openings unrealistically. Example: 1.0 keeps
    details sharp, 3.0 makes corridors look cleaner but broader.'
  managed: false
  exclusive_minimum: 0
sigma_r:
  group: Map Optimization
  description: 'Range sigma of the bilateral filter in occupancy-image intensity space.
    Larger values let dissimilar neighboring cells influence each other more. Small
    values preserve occupancy edges; large values can blur free/unknown borders. Example:
    10.0 is edge-preserving, 50.0 is much more permissive.'
  managed: false
  exclusive_minimum: 0
dilation_kernel_radius_cells:
  group: Map Optimization
  description: 'Free-space dilation radius after bilateral filtering, measured in
    cells. This expands filtered free regions before running WFD on the optimized
    map. Higher values help bridge tiny gaps, but can also over-open door thresholds.
    Example: 0 keeps the map literal, 2 can merge thin fragmented frontiers.'
  managed: false
goal_preemption_complete_if_within_m:
  group: Preemption
  description: Treat the current frontier as complete once the robot is this close
    to it; 0.0 disables this shortcut. This close-enough guard also works when visible-gain
    preemption is disabled, but obstacle-avoidance-heavy robots should use it carefully
    because large values can end a frontier too early and trigger wrong exploration
    choices.
  managed: false
goal_preemption_lidar_range_m:
  group: Preemption
  description: LiDAR range in meters used by the map-based visible reveal gate above.
  managed: false
goal_preemption_lidar_fov_deg:
  group: Preemption
  description: LiDAR field of view in degrees used by the visible reveal gate above.
  managed: false
  minimum: 0
  maximum: 360
goal_preemption_lidar_ray_step_deg:
  group: Preemption
  description: Angular spacing in degrees between LiDAR ray-cast samples for visible
    reveal estimation above.
  managed: false
  exclusive_minimum: 0
goal_preemption_lidar_min_reveal_length_m:
  group: Preemption
  description: Minimum visible reveal length in meters required to keep the current
    goal instead of preempting.
  managed: false
goal_preemption_lidar_yaw_offset_deg:
  group: Preemption
  description: Additional yaw offset in degrees applied to the target-pose LiDAR heading
    model above.
  managed: false
frontier_suppression_attempt_threshold:
  group: Suppression
  description: Number of failed attempts before a frontier area is temporarily suppressed.
  managed: false
frontier_suppression_base_size_m:
  group: Suppression
  description: Initial side length in meters for a newly suppressed square area.
  managed: false
frontier_suppression_expansion_size_m:
  group: Suppression
  description: Additional outer ring width in meters used to detect nearby repeated
    failures and expand suppression.
  managed: false
frontier_suppression_timeout_s:
  group: Suppression
  description: Suppression entry lifetime in seconds before old regions and attempts
    are removed.
  managed: false
frontier_suppression_no_progress_timeout_s:
  group: Suppression
  description: Maximum allowed time in seconds without meaningful progress before
    a frontier goal is canceled.
  managed: false
frontier_suppression_progress_epsilon_m:
  group: Suppression
  description: Minimum distance_remaining improvement in meters required to count
    as progress.
  managed: false
frontier_suppression_startup_grace_period_s:
  group: Suppression
  description: Delay suppression activation during startup so late navigation bring-up
    does not poison frontier memory.
  managed: false
frontier_suppression_max_attempt_records:
  group: Suppression
  description: Maximum number of tracked failed frontier attempt records kept in memory.
  managed: false
frontier_suppression_max_regions:
  group: Suppression
  description: Maximum number of active suppressed regions kept in memory.
  managed: false
use_sim_time:
  group: Benchmark Integration
  description: Use the worker simulation clock. Managed by the benchmark.
  managed: true
